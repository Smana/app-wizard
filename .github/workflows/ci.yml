name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # -race because the schema pipeline caches under a mutex and the HTTP
      # handlers read it concurrently; a data race there is a production bug the
      # unit tests would otherwise pass straight over.
      #
      # The skip check rides on the SAME invocation. Running the suite a second
      # time to count skips both doubled CI time and asserted about a different
      # run than the one that passed (-race vs not). `grep -E "^\s*--- SKIP"`
      # rather than an anchored match, because subtest skips are indented and an
      # anchored pattern misses exactly the table-driven ones a drift guard emits.
      - name: go test
        run: |
          set -o pipefail
          out=$(go test -race -v ./... 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -qE "^\s*--- SKIP"; then
            echo "::error::a test skipped itself; the schema drift guard is only real if it runs"
            echo "$out" | grep -E -A2 "^\s*--- SKIP"
            exit 1
          fi

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      # .golangci.yml has been in the repo since the split but nothing ran it.
      # Pinned rather than `latest`: the linter must be built with a Go at least
      # as new as the toolchain above, or it panics parsing the source
      # ("file requires newer Go version"). v2.13.1 is built with go1.27.0.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1

  ui:
    name: UI build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      # `npm run build` is `tsc -b && vite build`, so it type-checks already —
      # there is no separate lint step to run (the repo has no ESLint).
      - run: npm run build
