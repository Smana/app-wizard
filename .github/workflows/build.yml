name: Build image

on:
  push:
    branches: [main]
    # Release tags. The semver image tag is derived from the git tag pushed here
    # and nowhere else — see the tag policy on the metadata step below.
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/app-wizard

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        # Not needed for PR builds (they don't push), and a fork PR has no push token.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Tag policy. One rule matters: a semver tag is produced ONLY by a git
          # tag push, so it can never point at anything but the commit that was
          # tagged.
          #
          # It used to come from `ARG APP_WIZARD_VERSION` in the Dockerfile, which
          # every main build re-published. Forgetting to bump that ARG therefore
          # REASSIGNED the semver tag to a newer image — v0.1.0 silently moved
          # from the July build to the August one that way. A tag that looks
          # immutable and is not is worse than no tag at all.
          #
          #   branch push  -> main-<sha>            immutable, what deployments pin
          #   tag push v*  -> v1.2.3, v1.2, latest  the release
          #   pull request -> pr-<n>                built, never pushed
          tags: |
            type=ref,event=pr
            # {{branch}} is empty on a tag ref, which would render a bare "-<sha>",
            # so this is restricted to branch pushes rather than "not a PR".
            type=sha,prefix={{branch}}-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            # `v` prefix kept: it matches the git tags and the existing published
            # tags. {{version}} strips it, hence the explicit prefix.
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            # `latest` follows the newest RELEASE, not the newest main build — a
            # quickstart that pulls latest should get a version that was tagged
            # on purpose.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy scan (pushed image)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy results
        # Best-effort: uploading SARIF to the Security tab needs code scanning,
        # which a private repo only has with GitHub Advanced Security. Don't fail
        # the build when it's unavailable (it works once the repo is public).
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-app-wizard
